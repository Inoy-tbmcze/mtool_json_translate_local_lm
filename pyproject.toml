[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mtool-json-translate-local-lm"
version = "1.0.0"
description = "Local LLM game localization JSON cleaner, translator, and validator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "json_repair>=0.30.0",
    "transformers>=4.40.0",
]

[project.scripts]
mtool-translate = "mtool_translator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
