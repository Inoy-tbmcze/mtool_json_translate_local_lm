[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mtool-json-translate-local-lm"
version = "1.0.0"
description = "Local LLM game localization JSON cleaner, translator, and validator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "json_repair>=0.60.0",
    "transformers>=4.40.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14.0",
    "mypy>=1.10.0",
    "pylint>=3.1.0",
    "isort>=5.13.0",
]

[project.scripts]
mtool-translate = "mtool_translator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_configs = true

[tool.pylint.main]
source-roots = ["src", "."]
extension-pkg-allow-list = ["orjson"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.similarities]
min-similarity-lines = 15
ignore-comments = true
ignore-docstrings = true
ignore-imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
